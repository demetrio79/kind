apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>PRODUÇÃO - Demo ArgoCD v2.0</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          background: #022c22;
          color: #f8fafc;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }
        .card {
          background: #064e3b;
          border-radius: 12px;
          padding: 2.5rem 3.5rem;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
          text-align: center;
          border: 2px solid #34d399;
        }
        h1 { color: #34d399; margin-bottom: 0.5rem; }
        p { color: #f8f8f2; font-size: 1.1rem; }
        .badge {
          background: #10b981;
          color: #000;
          font-weight: bold;
          padding: 0.4rem 1rem;
          border-radius: 20px;
          display: inline-block;
          margin-top: 1rem;
          font-size: 0.95rem;
        }
        .features {
          margin-top: 1.2rem;
          padding: 0.8rem;
          background: #44475a;
          border-radius: 8px;
          font-size: 0.9rem;
          color: #50fa7b;
        }
        .host { color: #6272a4; margin-top: 1rem; font-size: 0.85rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🛠️ Ambiente de PRODUÇÃO (PRODUÇÃO) - v2.1</h1>
        <p>Nova funcionalidade lançada para validação na esteira!</p>
        <span class="badge">AMBIENTE: PRODUÇÃO (Versão 2.0)</span>
        <div class="features">✨ Novidade: Pipeline automatizada com Smoke Test e Promoção!</div>
        <div class="host">Host: prd.local</div>
      </div>
    </body>
    </html>
