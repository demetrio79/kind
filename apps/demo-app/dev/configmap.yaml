apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>DEV - Demo ArgoCD</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          background: #1e1e2e;
          color: #f8fafc;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }
        .card {
          background: #282a36;
          border-radius: 12px;
          padding: 2.5rem 3.5rem;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
          text-align: center;
          border: 2px solid #f1fa8c;
        }
        h1 { color: #f1fa8c; margin-bottom: 0.5rem; }
        p { color: #f8f8f2; font-size: 1.1rem; }
        .badge {
          background: #eab308;
          color: #000;
          font-weight: bold;
          padding: 0.4rem 1rem;
          border-radius: 20px;
          display: inline-block;
          margin-top: 1rem;
          font-size: 0.95rem;
        }
        .host { color: #6272a4; margin-top: 1rem; font-size: 0.85rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🛠️ Ambiente de Desenvolvimento (DEV)</h1>
        <p>Aplicação em teste contínuo via ArgoCD e Ingress</p>
        <span class="badge">AMBIENTE: DEV (2 Réplicas)</span>
        <div class="host">Host: dev.local</div>
      </div>
    </body>
    </html>
