apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-html
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Demo ArgoCD + Kind</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: #f8fafc;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }
        .card {
          background: #1e293b;
          border-radius: 12px;
          padding: 2rem 3rem;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
          text-align: center;
          border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .badge {
          background: #22c55e;
          color: #000;
          font-weight: bold;
          padding: 0.3rem 0.8rem;
          border-radius: 20px;
          display: inline-block;
          margin-top: 1rem;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>🚀 GitOps com ArgoCD + Kind</h1>
        <p>Aplicação sincronizada automaticamente pelo ArgoCD via Git!</p>
        <span class="badge">Versão 1.0</span>
      </div>
    </body>
    </html>
